<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voice Controlled ESP32</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e293b;
      padding: 2.5rem;
      border-radius: 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      text-align: center;
      width: 340px;
    }
    .mic-btn {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: #2563eb;
      color: white;
      border: none;
      font-size: 2.5rem;
      cursor: pointer;
      margin: 1.5rem 0;
      transition: all 0.3s ease;
      box-shadow: 0 0 20px rgba(37, 99, 235, 0.4);
    }
    .mic-btn.listening {
      background: #ef4444;
      box-shadow: 0 0 30px rgba(239, 68, 68, 0.7);
      transform: scale(1.08);
    }
    .status {
      font-size: 0.95rem;
      color: #94a3b8;
      min-height: 40px;
    }
    .badge {
      display: inline-block;
      margin-top: 1rem;
      padding: 8px 20px;
      border-radius: 20px;
      font-weight: 700;
      letter-spacing: 1px;
      background: #334155;
    }
    .badge.ON { background: #22c55e; color: #fff; }
    .badge.OFF { background: #64748b; color: #fff; }
  </style>
</head>
<body>

  <div class="card">
    <h2>ESP32 Voice Control</h2>
    <button id="micBtn" class="mic-btn" onclick="toggleSpeech()">🎤</button>
    <div id="statusText" class="status">Tap the microphone and speak</div>
    <div id="stateBadge" class="badge">STATE: UNKNOWN</div>
  </div>

  <script>
    let recognition;
    let isListening = false;

    function toggleSpeech() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Speech Recognition is not supported on this browser. Use Chrome or Edge.");
        return;
      }

      const btn = document.getElementById('micBtn');
      const status = document.getElementById('statusText');
      const badge = document.getElementById('stateBadge');

      if (isListening) {
        recognition.stop();
        return;
      }

      recognition = new SpeechRecognition();
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        isListening = true;
        btn.classList.add('listening');
        status.textContent = "Listening for audio...";
      };

      recognition.onresult = async (event) => {
        const text = event.results[0][0].transcript;
        status.textContent = `Processing: "${text}"...`;

        try {
          const response = await fetch('/api/voice', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ speech: text })
          });

          const data = await response.json();
          if (data.success) {
            status.textContent = `Command sent: "${text}"`;
            badge.textContent = `STATE: ${data.command}`;
            badge.className = `badge ${data.command}`;
          } else {
            status.textContent = "Error processing speech intent.";
          }
        } catch (err) {
          status.textContent = "Failed to communicate with API backend.";
        }
      };

      recognition.onend = () => {
        isListening = false;
        btn.classList.remove('listening');
      };

      recognition.start();
    }
  </script>
</body>
</html>
