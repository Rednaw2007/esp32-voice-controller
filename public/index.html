<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ESP32 Voice Controller</title>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    button { padding: 15px 30px; font-size: 18px; cursor: pointer; border-radius: 8px; border: none; background: #0070f3; color: white; }
    button.listening { background: #e00; }
    .badge { margin-top: 20px; padding: 10px 20px; font-weight: bold; border-radius: 4px; display: inline-block; }
    .badge.ON { background: #4caf50; color: white; }
    .badge.OFF { background: #f44336; color: white; }
  </style>
</head>
<body>

  <h1>ESP32 Voice Control</h1>
  <button id="micBtn" onclick="toggleSpeech()">Start Listening</button>
  
  <div id="status" style="margin-top: 15px;">Press button and state a command...</div>
  <div id="badge" class="badge OFF">STATE: OFF</div>

  <script>
    const btn = document.getElementById('micBtn');
    const status = document.getElementById('status');
    const badge = document.getElementById('badge');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    let isListening = false;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        isListening = true;
        btn.classList.add('listening');
        btn.textContent = 'Listening...';
        status.textContent = 'Listening for command...';
      };

      recognition.onresult = async (event) => {
        const text = event.results[0][0].transcript;
        status.textContent = `Processing: "${text}"`;

        try {
          const response = await fetch('/api/voice', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ speech: text })
          });

          const data = await response.json();

          if (data.success) {
            status.textContent = `Command sent: "${text}"`;
            badge.textContent = `STATE: ${data.command}`;
            badge.className = `badge ${data.command}`;

            if (data.command === 'ON') {
              speak("Turning on");
            } else if (data.command === 'OFF') {
              speak("Turning off");
            }
          } else {
            status.textContent = "Error processing speech intent.";
            speak("Sorry, I could not process that request.");
          }
        } catch (err) {
          console.error(err);
          status.textContent = "Failed to communicate with API backend.";
          speak("Error communicating with the server.");
        }
      };

      recognition.onend = () => {
        isListening = false;
        btn.classList.remove('listening');
        btn.textContent = 'Start Listening';
      };
    } else {
      status.textContent = 'Speech Recognition API is not supported in this browser.';
    }

    function toggleSpeech() {
      if (!recognition) return;
      if (isListening) {
        recognition.stop();
      } else {
        recognition.start();
      }
    }

    function speak(message) {
      if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance(message);
        window.speechSynthesis.speak(utterance);
      }
    }
  </script>
</body>
</html>
